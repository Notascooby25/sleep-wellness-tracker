name: Publish GHCR Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    # Only on push: pull request checks must still run and report for docs-only
    # changes, but merging them needn't rebuild and redeploy production.
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sleeptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/sleeptest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest tests -q

      - name: Run script tests
        run: |
          bash scripts/tests/test_preview.sh
          bash scripts/tests/test_restore_dump.sh
          bash scripts/tests/test_sync_backups_to_google.sh
          bash scripts/tests/test_host_config_and_cron.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Lint backend (ruff)
        run: |
          pip install ruff==0.16.3
          ruff check --select E4,E7,E9,F backend/app

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend deps
        working-directory: frontend-web
        run: npm install

      - name: Generate SvelteKit types
        working-directory: frontend-web
        run: npx svelte-kit sync

      - name: Type-check frontend (svelte-check)
        working-directory: frontend-web
        run: npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  publish:
    needs: [lint, backend-tests]
    # Manual runs too: only main may ever publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build both first, so a failed build can't leave one half of the app updated.
      - name: Build both images before pushing either
        run: |
          docker buildx build --file backend/Dockerfile --cache-from type=gha,scope=backend --cache-to type=gha,mode=max,scope=backend backend
          docker buildx build --file frontend-web/Dockerfile --cache-from type=gha,scope=frontend --cache-to type=gha,mode=max,scope=frontend frontend-web

      - name: Extract backend image metadata
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/notascooby25/sleep-wellness-tracker-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}

      - name: Extract frontend-web image metadata
        id: frontend_web_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/notascooby25/sleep-wellness-tracker-frontend-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push frontend-web image
        uses: docker/build-push-action@v6
        with:
          context: frontend-web
          file: frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend_web_meta.outputs.tags }}
          labels: ${{ steps.frontend_web_meta.outputs.labels }}

