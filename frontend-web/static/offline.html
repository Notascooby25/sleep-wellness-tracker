<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sleep Wellness Tracker — Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f2f6fc; color: #163c61; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 1.5rem; text-align: center; }
      .card { max-width: 360px; }
      h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
      p { color: #486888; }
      button { margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 8px; border: none; background: #0e2f4f; color: #fff; font-size: 0.95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Can't reach the server</h1>
      <p>Sleep Wellness Tracker can't connect right now. Check your connection to the server and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
